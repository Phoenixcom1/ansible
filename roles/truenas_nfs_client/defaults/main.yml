---
# NFS mounts exported by a TrueNAS server. Define these per inventory/customer.
truenas_nfs_mounts: []

# Derive the TrueNAS endpoint from the per-client base URL.
truenas_nfs_server: "truenas.{{ customer_domain }}"

# Allow containers to access NFS volumes under enforcing SELinux.
truenas_nfs_enable_container_access: true
