---
- name: Install Podman
  ansible.builtin.apt:
    name:
      - podman
  become: true

- name: Install podman compose plugin
  ansible.builtin.apt:
    name:
      - podman-compose
  become: true

- name: Configure user namespaces and subuid/subgid mappings (sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 $USER)
  ansible.builtin.command:
    cmd: "usermod --add-subuids 100000-165535 --add-subgids 100000-165535 {{ local_username }}"
  become: true
