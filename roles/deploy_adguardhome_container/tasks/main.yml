---
# AdGuard Home service deployment using Podman Quadlets

# Configure system to allow unprivileged port binding for DNS (port 53)
- name: Configure unprivileged port start for DNS
  sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "53"
    sysctl_file: /etc/sysctl.d/99-adguardhome-unprivileged-ports.conf
    state: present
    reload: yes
  become: true

# Disable systemd-resolved DNS stub listener to free port 53
- name: Create systemd-resolved drop-in directory
  file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Disable systemd-resolved DNS stub listener
  copy:
    dest: /etc/systemd/resolved.conf.d/adguardhome.conf
    content: |
      [Resolve]
      DNSStubListener=no
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart systemd-resolved

- name: Remove systemd-resolved stub resolv.conf symlink
  file:
    path: /etc/resolv.conf
    state: absent
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Link resolv.conf to systemd-resolved upstream DNS
  file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: yes
  become: true
  when: ansible_facts['os_family'] == 'Debian'

# Flush handlers to ensure systemd-resolved is restarted before AdGuard Home starts
- name: Apply systemd-resolved configuration changes
  meta: flush_handlers

# Discover podman user's UID and GID
- name: Get podman user info
  getent:
    database: passwd
    key: "{{ podman_user }}"
  register: podman_user_info
  changed_when: false

- name: Extract podman user UID and GID
  set_fact:
    podman_user_uid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][1] }}"
    podman_user_gid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][2] }}"
  when: podman_user in podman_user_info.ansible_facts.getent_passwd

# Create work and config directories
- name: Check if adguardhome work directory exists
  stat:
    path: "{{ adguardhome_work_dir }}"
  register: adguardhome_work_stat

- name: Create adguardhome work directory if missing
  file:
    path: "{{ adguardhome_work_dir }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true
  when: not adguardhome_work_stat.stat.exists

- name: Check if adguardhome conf directory exists
  stat:
    path: "{{ adguardhome_conf_dir }}"
  register: adguardhome_conf_stat

- name: Create adguardhome conf directory if missing
  file:
    path: "{{ adguardhome_conf_dir }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true
  when: not adguardhome_conf_stat.stat.exists

# Create Quadlet directory (Podman systemd units)
- name: Create Quadlet directory for podman user
  file:
    path: "/home/{{ podman_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true

# Deploy Quadlet container file
- name: Deploy adguardhome Quadlet container file
  template:
    src: adguardhome.container.j2
    dest: "/home/{{ podman_user }}/.config/containers/systemd/adguardhome.container"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: quadlet_deployed

# Enable lingering for podman user (allows user services to run without login)
- name: Enable lingering for podman user
  command: loginctl enable-linger {{ podman_user }}
  become: true
  changed_when: false

# Reload systemd daemon to pick up Quadlet changes
- name: Reload systemd user daemon (Quadlet generation)
  systemd:
    daemon_reload: yes
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"

# Restart service if Quadlet changed, otherwise ensure it's enabled and started
- name: Restart adguardhome service (Quadlet changed)
  systemd:
    name: adguardhome
    state: restarted
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  when: quadlet_deployed.changed

- name: Ensure adguardhome service is enabled and started
  systemd:
    name: adguardhome
    enabled: yes
    state: started
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"

# Deploy nginx reverse proxy configuration
- name: Deploy nginx reverse proxy config for adguardhome
  template:
    src: adguardhome.conf.j2
    dest: /etc/nginx/sites-available/adguardhome.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: reload nginx

- name: Enable adguardhome nginx site
  file:
    src: /etc/nginx/sites-available/adguardhome.conf
    dest: /etc/nginx/sites-enabled/adguardhome.conf
    state: link
    owner: root
    group: root
  become: true
  notify: reload nginx
