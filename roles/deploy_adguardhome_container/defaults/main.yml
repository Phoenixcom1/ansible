---
# AdGuard Home service deployment configuration

# Quadlet settings
adguardhome_project_name: adguardhome
adguardhome_quadlet_file: adguardhome.container
adguardhome_quadlet_template: adguardhome.container.j2
podman_containers_systemd_dir: "/home/{{ podman_user }}/.config/containers/systemd"

# Volume and config paths
adguardhome_work_dir: "{{ podman_service_dir }}/{{ adguardhome_project_name }}/work"
adguardhome_conf_dir: "{{ podman_service_dir }}/{{ adguardhome_project_name }}/conf"

# AdGuard Home application settings
adguardhome_domain: "adguard-sec.{{ customer_domain }}"
adguardhome_client_url: "https://{{ adguardhome_domain }}"
adguardhome_image: "docker.io/adguard/adguardhome:latest"
adguardhome_auto_update: true
adguardhome_admin_port: 3180 # Admin interface (reverse proxied)
adguardhome_initial_setup_enabled: false
adguardhome_initial_setup_port: 3010 # Only for initial setup

# DNS Ports
adguardhome_dns_port_tcp: 53
adguardhome_dns_port_udp: 53

# DHCP Ports (optional, enable if needed)
adguardhome_dhcp_enabled: false
adguardhome_dhcp_server_port: 67
adguardhome_dhcp_client_port: 68

# DNS over TLS/QUIC Ports
adguardhome_dot_port: 853 # DNS over TLS
adguardhome_doq_port_853: 853 # DNS over QUIC
adguardhome_doq_port_784: 784 # DNS over QUIC
adguardhome_doq_port_8853: 8853 # DNS over QUIC

# DNSCrypt Ports
adguardhome_dnscrypt_port: 5443

# Environment variables
adguardhome_timezone: "Europe/Paris"

# Podman user and network
podman_user: "{{ podman_username }}"
adguardhome_network: "adguardhome_net"
