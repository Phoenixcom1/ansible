---
# Vaultwarden service deployment using Podman Quadlets

# Discover podman user's UID and GID
- name: Get podman user info
  getent:
    database: passwd
    key: "{{ podman_user }}"
  register: podman_user_info
  changed_when: false

- name: Extract podman user UID and GID
  set_fact:
    podman_user_uid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][1] }}"
    podman_user_gid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][2] }}"
  when: podman_user in podman_user_info.ansible_facts.getent_passwd

# Create config directory
- name: Check if vaultwarden config directory exists
  stat:
    path: "{{ vaultwarden_config_dir }}"
  register: vaultwarden_config_stat

- name: Create vaultwarden config directory if missing
  file:
    path: "{{ vaultwarden_config_dir }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true
  when: not vaultwarden_config_stat.stat.exists

# Create Quadlet directory (Podman systemd units)
- name: Create Quadlet directory for podman user
  file:
    path: "/home/{{ podman_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true

- name: Deploy Vaultwarden network Quadlet
  template:
    src: vaultwarden.network.j2
    dest: "/home/{{ podman_user }}/.config/containers/systemd/{{ vaultwarden_network }}.network"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true

# Deploy Quadlet container file
- name: Deploy vaultwarden Quadlet container file
  template:
    src: vaultwarden.container.j2
    dest: "/home/{{ podman_user }}/.config/containers/systemd/vaultwarden.container"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: quadlet_deployed

# Enable lingering for podman user (allows user services to run without login)
- name: Enable lingering for podman user
  command: loginctl enable-linger {{ podman_user }}
  become: true
  changed_when: false

# Reload systemd daemon to pick up Quadlet changes
- name: Reload systemd user daemon (Quadlet generation)
  systemd:
    daemon_reload: yes
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"

# Restart service if Quadlet changed, otherwise ensure it's enabled and started
- name: Restart vaultwarden service (Quadlet changed)
  systemd:
    name: vaultwarden
    state: restarted
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  when: quadlet_deployed.changed

- name: Ensure vaultwarden service is enabled and started
  systemd:
    name: vaultwarden
    enabled: yes
    state: started
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  when: not quadlet_deployed.changed

# Wait for container to be healthy
- name: Wait for Vaultwarden container to be healthy
  command: podman healthcheck run vaultwarden
  become: true
  become_user: "{{ podman_user }}"
  register: vaultwarden_health
  retries: 10
  delay: 3
  until: vaultwarden_health.rc == 0
  changed_when: false
  ignore_errors: true

- name: Display vaultwarden deployment result
  debug:
    msg: |
      Vaultwarden deployed successfully via Podman Quadlet!
      - Quadlet: ~/.config/containers/systemd/vaultwarden.container
      - Service: vaultwarden.service (auto-generated by systemd)
      - Web UI: {{ vaultwarden_published_server_url }}
      - Auto-update: DISABLED (manual updates for safety)
      - Manage: systemctl --user status vaultwarden
      - Update: Use update-container.yml playbook
      - Health: {% if vaultwarden_health.rc == 0 %}PASSED{% else %}FAILED (check logs){% endif %}

- name: Get Vaultwarden container full status
  command: podman ps -a --filter name=vaultwarden --format='{% raw %}{{.Status}}{% endraw %}'
  become: true
  become_user: "{{ podman_user }}"
  register: vaultwarden_status
  changed_when: false

- name: Display vaultwarden deployment result
  debug:
    msg: |
      Vaultwarden deployed successfully!
      Container Status: {{ vaultwarden_status.stdout }}
      Accessible at: {{ vaultwarden_published_server_url }}

# Deploy nginx reverse proxy configuration
- name: Ensure nginx conf.d directory exists
  file:
    path: /etc/nginx/conf.d
    state: directory
    mode: 0755
  become: true

- name: Deploy vaultwarden nginx reverse proxy config
  template:
    src: vaultwarden.conf.j2
    dest: /etc/nginx/conf.d/vaultwarden.conf
    mode: "0644"
  notify: reload nginx
  become: true
