---
# Wyoming-openWakeWord service deployment using Podman Quadlets

# Discover podman user's UID and GID
- name: Get podman user info
  getent:
    database: passwd
    key: "{{ podman_user }}"
  register: podman_user_info
  changed_when: false

- name: Extract podman user UID and GID
  set_fact:
    podman_user_uid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][1] }}"
    podman_user_gid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][2] }}"
  when: podman_user in podman_user_info.ansible_facts.getent_passwd

# Create custom models directory for openWakeWord
- name: Check if openwakeword custom models directory exists
  stat:
    path: "{{ openwakeword_custom_models_dir }}"
  register: openwakeword_data_stat

- name: Create openwakeword custom models directory if missing
  file:
    path: "{{ openwakeword_custom_models_dir }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true
  when: not openwakeword_data_stat.stat.exists

# Ensure correct ownership (fix permission issues)
- name: Fix openwakeword custom models directory ownership
  file:
    path: "{{ openwakeword_custom_models_dir }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
    recurse: yes
  become: true

# Create Quadlet directory (Podman systemd units)
- name: Create Quadlet directory for podman user
  file:
    path: "/home/{{ podman_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true

# Deploy Quadlet file
- name: Deploy openwakeword Quadlet file
  template:
    src: openwakeword.container.j2
    dest: "/home/{{ podman_user }}/.config/containers/systemd/openwakeword.container"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: quadlet_deployed

# Enable lingering for podman user (allows user services to run without login)
- name: Enable lingering for podman user
  command: loginctl enable-linger {{ podman_user }}
  become: true
  changed_when: false

# Reload systemd daemon to pick up Quadlet changes
- name: Reload systemd user daemon (Quadlet generation)
  systemd:
    daemon_reload: yes
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"

# Restart service if Quadlet changed, otherwise ensure it's enabled and started
- name: Restart openwakeword service (Quadlet changed)
  systemd:
    name: openwakeword
    state: restarted
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  when: quadlet_deployed.changed

- name: Ensure openwakeword service is enabled and started
  systemd:
    name: openwakeword
    enabled: yes
    state: started
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  when: not quadlet_deployed.changed

- name: Display openwakeword deployment result
  debug:
    msg: |
      openWakeWord deployed successfully via Podman Quadlet!
      - Quadlet: ~/.config/containers/systemd/openwakeword.container
      - Service: openwakeword.service (auto-generated by systemd)
      - Port: {{ openwakeword_port }} (direct TCP access)
      - Pre-loaded models: alexa, hey_jarvis, hey_mycroft, hey_rhasspy, ok_nabu
      - Custom models: {{ openwakeword_custom_models_dir }}
      - Auto-update: Enabled (via AutoUpdate=registry in Quadlet)
      - Manage: systemctl --user status openwakeword
      - View logs: journalctl --user -u openwakeword -f
      - Note: Use IP address in Home Assistant (Wyoming uses raw TCP, not HTTP)

# Ensure podman auto-update timer is enabled
- name: Enable podman auto-update timer for podman user
  systemd:
    name: podman-auto-update.timer
    state: started
    enabled: yes
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
