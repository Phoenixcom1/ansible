---
- name: Validate TrueNAS SMB backup configuration
  assert:
    that:
      - truenas_smb_api_token | length > 0
      - truenas_smb_backup_password | length > 0
      - truenas_smb_dataset_encryption_passphrase | length > 0
  no_log: true

- name: Configure TrueNAS Restic SMB resources through JSON-RPC
  include_role:
    name: truenas_jsonrpc_provision
  vars:
    truenas_jsonrpc_provision_api_url: "{{ truenas_smb_api_url }}"
    truenas_jsonrpc_provision_api_token: "{{ truenas_smb_api_token }}"
    truenas_jsonrpc_provision_api_validate_certs: "{{ truenas_smb_api_validate_certs }}"
    truenas_jsonrpc_provision_policy:
      datasets:
        - name: "{{ truenas_smb_backup_dataset }}"
          share_type: SMB
          encryption: true
          encryption_options:
            generate_key: false
            passphrase: "{{ truenas_smb_dataset_encryption_passphrase }}"
            algorithm: "{{ truenas_smb_dataset_encryption_algorithm }}"
            pbkdf2iters: "{{ truenas_smb_dataset_encryption_pbkdf2iters | int }}"
      users:
        - username: "{{ truenas_smb_backup_username }}"
          full_name: "Restic backup account"
          password: "{{ truenas_smb_backup_password }}"
      permissions:
        - path: "{{ truenas_smb_backup_export_path }}"
          user: "{{ truenas_smb_backup_username }}"
          mode: "0700"
          options:
            recursive: false
            traverse: false
            stripacl: true
      shares:
        - type: smb
          path: "{{ truenas_smb_backup_export_path }}"
          name: "{{ truenas_smb_backup_share_name }}"
          comment: "Managed by Ansible: Restic backups"
      services: [cifs]

- name: Configure TrueNAS periodic snapshots for the Restic backup dataset
  include_role:
    name: truenas_snapshot_retention
  vars:
    truenas_snapshot_retention_api_url: "{{ truenas_smb_api_url }}"
    truenas_snapshot_retention_api_token: "{{ truenas_smb_api_token }}"
    truenas_snapshot_retention_api_validate_certs: "{{ truenas_smb_api_validate_certs }}"
    truenas_snapshot_retention_policies: "{{ truenas_smb_backup_snapshot_policies }}"
