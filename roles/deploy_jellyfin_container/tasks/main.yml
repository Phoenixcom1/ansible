---
# Jellyfin service deployment using Podman Quadlets

# Discover podman user's UID and GID
- name: Get podman user info
  getent:
    database: passwd
    key: "{{ podman_user }}"
  register: podman_user_info
  changed_when: false

- name: Extract podman user UID and GID
  set_fact:
    podman_user_uid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][1] }}"
    podman_user_gid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][2] }}"
  when: podman_user in podman_user_info.ansible_facts.getent_passwd

# Network mount setup (NFS or SMB)
- name: Install NFS utilities if using NFS mount
  apt:
    name: nfs-common
    state: present
    update_cache: yes
  become: true
  when: jellyfin_enable_network_mount and jellyfin_network_mount_type == "nfs"

- name: Install CIFS utilities if using SMB mount
  apt:
    name: cifs-utils
    state: present
    update_cache: yes
  become: true
  when: jellyfin_enable_network_mount and jellyfin_network_mount_type == "cifs"

# Create media mount directory (always, even if network mount is disabled)
- name: Create media mount directory
  file:
    path: "{{ jellyfin_media_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Mount network media directory (and persist to fstab)
  mount:
    path: "{{ jellyfin_media_dir }}"
    src: "{{ jellyfin_network_mount_source }}"
    fstype: "{{ jellyfin_network_mount_type }}"
    opts: "{{ jellyfin_network_mount_options }}"
    state: mounted
    dump: 0
    passno: 0
  become: true
  when: jellyfin_enable_network_mount

# Create config and cache directories
- name: Check if jellyfin config directory exists
  stat:
    path: "{{ jellyfin_config_dir }}"
  register: jellyfin_config_stat

- name: Create jellyfin config directory if missing
  file:
    path: "{{ jellyfin_config_dir }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true
  when: not jellyfin_config_stat.stat.exists

- name: Check if jellyfin cache directory exists
  stat:
    path: "{{ jellyfin_cache_dir }}"
  register: jellyfin_cache_stat

- name: Create jellyfin cache directory if missing
  file:
    path: "{{ jellyfin_cache_dir }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true
  when: not jellyfin_cache_stat.stat.exists

# Fix ownership of config and cache directories so podman user can manage them
- name: Fix config directory ownership (for podman user access)
  file:
    path: "{{ jellyfin_config_dir }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
    recurse: yes
  become: true

- name: Fix cache directory ownership (for podman user access)
  file:
    path: "{{ jellyfin_cache_dir }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
    recurse: yes
  become: true

# Create Quadlet directory (Podman systemd units)
- name: Create Quadlet directory for podman user
  file:
    path: "/home/{{ podman_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true

# Deploy Quadlet container file
- name: Deploy jellyfin Quadlet container file
  template:
    src: jellyfin.container.j2
    dest: "/home/{{ podman_user }}/.config/containers/systemd/jellyfin.container"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: quadlet_deployed

# Enable lingering for podman user (allows user services to run without login)
- name: Enable lingering for podman user
  command: loginctl enable-linger {{ podman_user }}
  become: true
  changed_when: false

# Reload systemd daemon to pick up Quadlet changes
- name: Reload systemd user daemon (Quadlet generation)
  systemd:
    daemon_reload: yes
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"

# Restart service if Quadlet changed, otherwise ensure it's enabled and started
- name: Restart jellyfin service (Quadlet changed)
  systemd:
    name: jellyfin
    state: restarted
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  when: quadlet_deployed.changed

- name: Ensure jellyfin service is enabled and started
  systemd:
    name: jellyfin
    enabled: yes
    state: started
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  when: not quadlet_deployed.changed

- name: Display jellyfin deployment result
  debug:
    msg: |
      Jellyfin deployed successfully via Podman Quadlet!
      - Quadlet: ~/.config/containers/systemd/jellyfin.container
      - Service: jellyfin.service (auto-generated by systemd)
      - Accessible at: https://{{ jellyfin_domain }}
      - Auto-update: Enabled (via AutoUpdate=registry in Quadlet)
      - Manage: systemctl --user status jellyfin

# Deploy nginx reverse proxy configuration
- name: Ensure nginx conf.d directory exists
  file:
    path: /etc/nginx/conf.d
    state: directory
    mode: 0755
  become: true

- name: Deploy jellyfin nginx reverse proxy config
  template:
    src: jellyfin.conf.j2
    dest: /etc/nginx/conf.d/jellyfin.conf
    mode: "0644"
  notify: reload nginx
  become: true
