# Wildcard certificate locations deployed by your firewall
ssl_cert: "/etc/ssl/wildcard/kerberos.fassbender.contact/fullchain.pem"
ssl_key: "/etc/ssl/wildcard/kerberos.fassbender.contact/key.pem"

# Network binding (optional: specify IP to bind nginx to VLAN 100)
# Leave empty to bind to all interfaces, or set to VLAN IP like "192.168.100.2"
nginx_listen_ip: ""

# Homepage reverse proxy
homepage_domain: "homepage.kerberos.fassbender.contact"
homepage_port: 3000
