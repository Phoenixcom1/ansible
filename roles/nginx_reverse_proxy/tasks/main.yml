---
- name: Ensure distribution is supported
  assert:
    that:
      - host_os_family is defined
      - host_pkg_backend is defined
      - host_os_family in ['Debian', 'RedHat']
    fail_msg: "This role supports Ubuntu/Debian and Fedora/RHEL-family hosts only."
  become: true

- name: Ensure nginx is installed on Debian/Ubuntu
  apt:
    name: "{{ nginx_package_name }}"
    state: present
    update_cache: true
  when: host_is_debian
  become: true

- name: Check whether nginx is installed on dnf5 hosts
  command: "rpm -q {{ nginx_package_name }}"
  register: nginx_rpm_query
  changed_when: false
  failed_when: false
  when: host_uses_dnf5
  become: true

- name: Ensure nginx is installed on dnf5 hosts
  command: "dnf -y install {{ nginx_package_name }}"
  when:
    - host_uses_dnf5
    - nginx_rpm_query.rc != 0
  become: true

- name: Ensure nginx is installed on RedHat family (non-dnf5)
  dnf:
    name: "{{ nginx_package_name }}"
    state: present
  when:
    - host_is_redhat
    - not host_uses_dnf5
  become: true

- name: Ensure SSL certificate directory exists
  file:
    path: "{{ nginx_ssl_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ nginx_ssl_dir_owner }}"
    group: "{{ nginx_ssl_dir_group }}"
  become: true

- name: Check whether the configured SSL certificate exists
  stat:
    path: "{{ ssl_cert }}"
  register: nginx_ssl_cert_stat
  become: true

- name: Check whether the configured SSL private key exists
  stat:
    path: "{{ ssl_key }}"
  register: nginx_ssl_key_stat
  become: true

- name: Report SSL certificate presence
  debug:
    msg: "SSL certificate check: cert={{ nginx_ssl_cert_stat.stat.exists }}, key={{ nginx_ssl_key_stat.stat.exists }}"
  become: true

- name: Ensure config directory exists
  file:
    path: "{{ nginx_conf_dir }}"
    state: directory
    mode: 0755
  become: true

- name: Check if SSL certificate files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ ssl_cert }}"
    - "{{ ssl_key }}"
  register: ssl_cert_check
  become: true

- name: Remove stale global SSL configuration when certificates are missing
  ansible.builtin.file:
    path: "{{ nginx_conf_dir }}/00-default-ssl.conf"
    state: absent
  become: true
  when: not (ssl_cert_check.results[0].stat.exists and ssl_cert_check.results[1].stat.exists)

- name: Deploy global SSL configuration
  template:
    src: 00-default-ssl.conf.j2
    dest: "{{ nginx_conf_dir }}/00-default-ssl.conf"
    mode: "0644"
  become: true
  when: ssl_cert_check.results[0].stat.exists and ssl_cert_check.results[1].stat.exists

- name: Warn if SSL certificates are missing
  ansible.builtin.debug:
    msg: "SSL certificates not found at {{ ssl_cert }} or {{ ssl_key }} - skipping global SSL config deployment"
  when: not (ssl_cert_check.results[0].stat.exists and ssl_cert_check.results[1].stat.exists)

# Test nginx configuration before attempting to start the service
- name: Test nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  register: nginx_test
  ignore_errors: true
  changed_when: false
  become: true

- name: Show nginx test output on failure
  ansible.builtin.debug:
    var: nginx_test
  when: nginx_test.rc is defined and nginx_test.rc != 0

- name: Warn if nginx test failed due to missing SSL certificates
  ansible.builtin.debug:
    msg: "nginx test failed (likely due to missing SSL certificates). This is expected if certs haven't been provisioned yet. nginx will be started anyway."
  when: nginx_test.rc is defined and nginx_test.rc != 0 and "cannot load certificate" in (nginx_test.stderr | default(''))

- name: Fail if nginx configuration test failed for non-SSL reasons
  ansible.builtin.fail:
    msg: "nginx configuration test failed: {{ nginx_test.stderr | default('') }} {{ nginx_test.stdout | default('') }}"
  when: nginx_test.rc is defined and nginx_test.rc != 0 and "cannot load certificate" not in (nginx_test.stderr | default(''))

- name: Ensure nginx is enabled and running
  systemd:
    name: "{{ nginx_service_name }}"
    enabled: yes
    state: started
  become: true

- name: Enable SELinux booleans for reverse proxy network access (RedHat family)
  ansible.builtin.seboolean:
    name: "{{ item }}"
    state: true
    persistent: true
  loop:
    - httpd_can_network_connect
    - httpd_can_network_relay
  when: ansible_facts['os_family'] == 'RedHat'
  become: true

- name: Ensure firewalld is installed (RedHat family)
  ansible.builtin.package:
    name: firewalld
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  become: true

- name: Ensure firewalld is enabled and running (RedHat family)
  ansible.builtin.systemd:
    name: firewalld
    enabled: yes
    state: started
  when: ansible_facts['os_family'] == 'RedHat'
  become: true

- name: Check whether HTTP and HTTPS services are already open in firewalld (RedHat family)
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --query-service={{ item }}"
  register: nginx_firewall_service_checks
  changed_when: false
  failed_when: false
  loop:
    - http
    - https
  when: ansible_facts['os_family'] == 'RedHat'
  become: true

- name: Open HTTP and HTTPS in firewalld (RedHat family)
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --add-service={{ item.item }}"
  loop: "{{ nginx_firewall_service_checks.results }}"
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - item.rc != 0
  become: true

- name: Reload firewalld to apply permanent rules (RedHat family)
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  when: ansible_facts['os_family'] == 'RedHat'
  become: true
