---
# Paperless-ngx service deployment configuration

# Compose file settings
paperless_project_name: paperless
paperless_compose_file: compose_paperless.yml
paperless_compose_template: compose_paperless.yml.j2
paperless_repo_path: "{{ podman_service_dir }}/{{ paperless_project_name }}"

# External env file (should exist on target machine)
paperless_env_file: "{{ paperless_repo_path }}/paperless.env"

# Scripts .env file (for link_email_docs.py - contains PAPERLESS_URL and PAPERLESS_TOKEN)
paperless_scripts_env_file: "{{ paperless_scripts_dir }}/.env"

# Volume and config paths
paperless_data_dir: "{{ podman_service_dir }}/{{ paperless_project_name }}/data"
paperless_media_dir: "{{ podman_service_dir }}/{{ paperless_project_name }}/media"
paperless_export_dir: "{{ podman_service_dir }}/{{ paperless_project_name }}/export"
paperless_consume_dir: "{{ podman_service_dir }}/{{ paperless_project_name }}/consume"
paperless_scripts_dir: "{{ podman_service_dir }}/{{ paperless_project_name }}/scripts"
paperless_custom_init_dir: "{{ podman_service_dir }}/{{ paperless_project_name }}/custom-cont-init.d"
paperless_redis_dir: "{{ podman_service_dir }}/{{ paperless_project_name }}/redisdata"

# Network configuration (isolated from other containers)
paperless_network: paperless_net
paperless_network_driver: bridge

# Paperless application settings
paperless_domain: "paperless.kerberos.fassbender.contact"
paperless_port: 8810
paperless_internal_port: 8000

# Container-specific environment variables (not in paperless.env)
# These are set in the compose file as they depend on the container setup
paperless_redis_url: "redis://broker:6379"

# Paperless features
paperless_consumer_delete_duplicates: true
paperless_tika_enabled: true
paperless_tika_gotenberg_endpoint: "http://gotenberg:3000"
paperless_tika_endpoint: "http://tika:9998"

# Custom script configuration for link_email_docs.py
paperless_connected_document_field_id: 1
paperless_task_id_custom_field_id: 3
paperless_gmx_input_tag_id: 9
paperless_shared_gmail_input_tag_id: 3

# Gotenberg configuration
gotenberg_chromium_disable_javascript: true
gotenberg_chromium_allow_list: "file:///tmp/.*"
gotenberg_libreoffice_disable_routes: false
gotenberg_libreoffice_auto_start: true
gotenberg_libreoffice_start_timeout: "300s"
gotenberg_api_timeout: "300s"
