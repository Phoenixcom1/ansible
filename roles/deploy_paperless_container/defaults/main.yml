---
# Paperless-ngx service deployment configuration

# Podman user
podman_user: "{{ podman_username }}"

# Repository path (for env files and scripts)
paperless_repo_path: "{{ podman_service_dir }}/paperless"

# External env file (should exist on target machine)
paperless_env_file: "{{ paperless_repo_path }}/paperless.env"

# Scripts .env file (for link_email_docs.py - contains PAPERLESS_URL and PAPERLESS_TOKEN)
paperless_scripts_env_file: "{{ paperless_scripts_dir }}/.env"

# Volume and config paths
paperless_data_dir: "{{ paperless_repo_path }}/data"
paperless_media_dir: "{{ paperless_repo_path }}/media"
paperless_export_dir: "{{ paperless_repo_path }}/export"
paperless_consume_dir: "{{ paperless_repo_path }}/consume"
paperless_scripts_dir: "{{ paperless_repo_path }}/scripts"
paperless_custom_init_dir: "{{ paperless_repo_path }}/custom-cont-init.d"
paperless_redis_dir: "{{ paperless_repo_path }}/redisdata"

# Network mount configuration for consume directory
paperless_enable_network_mount: true
paperless_network_mount_source: "//datenbunker.local/Paperless/Consume"
paperless_network_mount_type: "cifs"
# NOTE: paperless_host_uid and paperless_host_gid are calculated dynamically in tasks
# based on the podman user's subordinate UID range from /etc/subuid
# This ensures proper UID mapping for rootless podman user namespaces
paperless_network_mount_options: "vers=3.1.1,_netdev,credentials={{ paperless_smbcredentials_file }},uid={{ paperless_host_uid }},gid={{ paperless_host_gid }},file_mode=0664,dir_mode=0775,rw"
paperless_smbcredentials_file: "/root/.paperless_smbcreds"

# Network configuration (isolated from other containers)
paperless_network: paperless_net
paperless_network_driver: bridge

# Paperless application settings
paperless_domain: "paperless.kerberos.fassbender.contact"
paperless_port: 8810
paperless_internal_port: 8000

# Container-specific environment variables (not in paperless.env)
# These are set directly as they depend on the container setup
# Container names match the service names in the isolated network
paperless_redis_url: "redis://paperless-redis:6379"

# Paperless features
paperless_consumer_delete_duplicates: true
paperless_tika_enabled: true
paperless_tika_gotenberg_endpoint: "http://paperless-gotenberg:3000"
paperless_tika_endpoint: "http://paperless-tika:9998"

# Consumer polling for network mounts
# inotify doesn't work on CIFS/SMB mounts, so polling is required
# Set to 1 when using network mounts, 0 for local directories
paperless_consumer_polling: "{{ 1 if paperless_enable_network_mount else 0 }}"
# Polling interval in seconds (how often to check for new files)
paperless_consumer_polling_delay: 5

# Custom script configuration for link_email_docs.py
paperless_connected_document_field_id: 1
paperless_task_id_custom_field_id: 3
paperless_gmx_input_tag_id: 9
paperless_shared_gmail_input_tag_id: 3

# Gotenberg configuration
gotenberg_chromium_disable_javascript: true
gotenberg_chromium_allow_list: "file:///tmp/.*"
gotenberg_libreoffice_disable_routes: false
gotenberg_libreoffice_auto_start: true
gotenberg_libreoffice_start_timeout: "300s"
gotenberg_api_timeout: "300s"
