---
# Paperless-ngx service deployment

# Discover podman user's UID and GID
- name: Get podman user info
  getent:
    database: passwd
    key: "{{ podman_user }}"
  register: podman_user_info
  changed_when: false

- name: Extract podman user UID and GID
  set_fact:
    paperless_uid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][1] }}"
    paperless_gid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][2] }}"
  when: podman_user in podman_user_info.ansible_facts.getent_passwd

- name: Display discovered podman user UID and GID
  debug:
    msg: "Podman user '{{ podman_user }}' has UID={{ paperless_uid }} GID={{ paperless_gid }}"

# Get the subordinate UID mapping for user namespace calculation
- name: Check if /etc/subuid exists
  stat:
    path: /etc/subuid
  register: subuid_file

- name: Read /etc/subuid content for debugging
  command: cat /etc/subuid
  register: subuid_content
  changed_when: false
  check_mode: false
  when: subuid_file.stat.exists

- name: Display /etc/subuid content
  debug:
    msg: "{{ subuid_content.stdout_lines }}"
  when: subuid_file.stat.exists

- name: Get subordinate UID range for podman user
  shell: "awk -F: '/^{{ podman_user }}:/ {print $2}' /etc/subuid"
  register: subuid_start
  changed_when: false
  check_mode: false

- name: Debug subuid lookup
  debug:
    msg: "subuid_start raw output: '{{ subuid_start.stdout }}' (length: {{ subuid_start.stdout | length }})"

- name: Calculate host UID that maps to container paperless user (UID 1000)
  set_fact:
    # Container UID 1000 maps to: subuid_start + (1000 - 1)
    paperless_host_uid: "{{ (subuid_start.stdout | default('0') | int) + 999 }}"
    paperless_host_gid: "{{ (subuid_start.stdout | default('0') | int) + 999 }}"
  when: subuid_start.stdout | length > 0

- name: Fail if subordinate UID range not found
  fail:
    msg: "Could not find subordinate UID range for user '{{ podman_user }}' in /etc/subuid"
  when: subuid_start.stdout | length == 0

- name: Display calculated SMB mount UID/GID
  debug:
    msg: |
      User namespace mapping:
        Container UID 0 → Host UID {{ paperless_uid }}
        Container UID 1+ → Host UID {{ subuid_start.stdout }}+
        Container UID 1000 (paperless) → Host UID {{ paperless_host_uid }}
      SMB mount will use host UID={{ paperless_host_uid }} GID={{ paperless_host_gid }}

# Network mount setup for consume directory
- name: Install CIFS utilities if using SMB mount
  apt:
    name: cifs-utils
    state: present
    update_cache: yes
  become: true
  when: paperless_enable_network_mount and paperless_network_mount_type == "cifs"

- name: Create consume mount directory
  file:
    path: "{{ paperless_consume_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

#SMB Creds are copied in common role
- name: Mount network consume directory (and persist to fstab)
  mount:
    path: "{{ paperless_consume_dir }}"
    src: "{{ paperless_network_mount_source }}"
    fstype: "{{ paperless_network_mount_type }}"
    opts: "{{ paperless_network_mount_options }}"
    state: mounted
    dump: 0
    passno: 0
  become: true
  when: paperless_enable_network_mount

# Configure system settings for Redis
- name: Enable memory overcommit for Redis
  sysctl:
    name: vm.overcommit_memory
    value: "1"
    state: present
    sysctl_set: true
    reload: true
  become: true

# Create all required directories (excluding consume dir which is network mounted)
- name: Check if paperless directories exist
  stat:
    path: "{{ item }}"
  loop:
    - "{{ paperless_repo_path }}"
    - "{{ paperless_data_dir }}"
    - "{{ paperless_media_dir }}"
    - "{{ paperless_export_dir }}"
    - "{{ paperless_scripts_dir }}"
    - "{{ paperless_custom_init_dir }}"
    - "{{ paperless_redis_dir }}"
  register: paperless_dir_stats

- name: Create paperless directories if missing
  file:
    path: "{{ item.item }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true
  loop: "{{ paperless_dir_stats.results }}"
  when: not item.stat.exists

# Create the isolated network for paperless
- name: Create isolated paperless network
  command: podman network create {{ paperless_network }}
  become: true
  become_user: "{{ podman_user }}"
  register: paperless_network_result
  changed_when: "'Created' in paperless_network_result.stdout or 'already exists' not in paperless_network_result.stderr"
  failed_when: paperless_network_result.rc != 0 and 'already exists' not in paperless_network_result.stderr
  ignore_errors: true

# Check for environment file
- name: Check if paperless.env file exists
  stat:
    path: "{{ paperless_env_file }}"
  register: paperless_env_stat

- name: Fail if paperless.env file is missing
  fail:
    msg: |
      paperless.env file not found at {{ paperless_env_file }}
      Please create this file with required environment variables before running this role.
  when: not paperless_env_stat.stat.exists

# Check for scripts .env file
- name: Check if scripts/.env file exists
  stat:
    path: "{{ paperless_scripts_env_file }}"
  register: paperless_scripts_env_stat

- name: Warn if scripts/.env file is missing
  debug:
    msg: |
      WARNING: scripts/.env file not found at {{ paperless_scripts_env_file }}
      The link_email_docs.py script requires this file with PAPERLESS_URL and PAPERLESS_TOKEN.
      Please create this file manually if you plan to use the email linking functionality.
  when: not paperless_scripts_env_stat.stat.exists

- name: Deploy custom init script
  template:
    src: 10-custom-init.sh.j2
    dest: "{{ paperless_custom_init_dir }}/10-custom-init.sh"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true

- name: Deploy post-consumption wrapper script
  template:
    src: post-consumption-wrapper.sh.j2
    dest: "{{ paperless_scripts_dir }}/post-consumption-wrapper.sh"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true

- name: Deploy link_email_docs.py script
  template:
    src: link_email_docs.py.j2
    dest: "{{ paperless_scripts_dir }}/link_email_docs.py"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true

# Deploy Quadlet container files
- name: Get podman user UID for Quadlet deployment
  set_fact:
    podman_user_uid: "{{ paperless_uid }}"
    podman_user_gid: "{{ paperless_gid }}"

- name: Ensure Quadlet directory exists
  file:
    path: "/home/{{ podman_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true

- name: Ensure user systemd directory exists
  file:
    path: "/home/{{ podman_user }}/.config/systemd/user"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true

- name: Deploy paperless-redis Quadlet container file
  template:
    src: paperless-redis.container.j2
    dest: "/home/{{ podman_user }}/.config/containers/systemd/paperless-redis.container"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: redis_quadlet_deployed

- name: Deploy paperless-gotenberg Quadlet container file
  template:
    src: paperless-gotenberg.container.j2
    dest: "/home/{{ podman_user }}/.config/containers/systemd/paperless-gotenberg.container"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: gotenberg_quadlet_deployed

- name: Deploy paperless-tika Quadlet container file
  template:
    src: paperless-tika.container.j2
    dest: "/home/{{ podman_user }}/.config/containers/systemd/paperless-tika.container"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: tika_quadlet_deployed

- name: Deploy paperless-webserver Quadlet container file
  template:
    src: paperless-webserver.container.j2
    dest: "/home/{{ podman_user }}/.config/containers/systemd/paperless-webserver.container"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: webserver_quadlet_deployed

- name: Deploy paperless-stack systemd target (for managing all services together)
  template:
    src: paperless-stack.target.j2
    dest: "/home/{{ podman_user }}/.config/systemd/user/paperless-stack.target"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: stack_target_deployed

- name: Enable lingering for podman user
  command: loginctl enable-linger {{ podman_user }}
  become: true
  changed_when: false

- name: Reload systemd user daemon (Quadlet generation)
  systemd:
    daemon_reload: yes
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"

# Manage services via stack target (instead of individually)
- name: Check if any Quadlet changed
  set_fact:
    any_quadlet_changed: "{{ redis_quadlet_deployed.changed or gotenberg_quadlet_deployed.changed or tika_quadlet_deployed.changed or webserver_quadlet_deployed.changed or stack_target_deployed.changed }}"

- name: Restart paperless stack if any Quadlet changed
  systemd:
    name: paperless-stack.target
    state: restarted
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  when: any_quadlet_changed

- name: Ensure paperless stack is enabled and started
  systemd:
    name: paperless-stack.target
    enabled: yes
    state: started
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  when: not any_quadlet_changed

# Wait for containers to be healthy
- name: Wait for paperless-redis container to be healthy
  command: podman healthcheck run paperless-redis
  become: true
  become_user: "{{ podman_user }}"
  register: redis_health
  retries: 10
  delay: 3
  until: redis_health.rc == 0
  changed_when: false
  ignore_errors: true

- name: Wait for paperless-webserver container to be healthy
  command: podman healthcheck run paperless-webserver
  become: true
  become_user: "{{ podman_user }}"
  register: webserver_health
  retries: 20
  delay: 5
  until: webserver_health.rc == 0
  changed_when: false
  ignore_errors: true

- name: Display paperless deployment result
  debug:
    msg: |
      Paperless deployed successfully via Podman Quadlets!
      - Quadlets: ~/.config/containers/systemd/paperless-*.container
      - Services: paperless-redis.service, paperless-gotenberg.service, paperless-tika.service, paperless-webserver.service
      - Stack Target: paperless-stack.target (manage all services together)
      - Web UI: https://{{ paperless_domain }}
      - Auto-update: DISABLED (manual updates for safety - interdependent services)
      - Manage individual: systemctl --user status paperless-webserver
      - Manage stack: systemctl --user restart paperless-stack.target
      - Update: Use update-paperless.yml playbook
      - Redis Health: {% if redis_health.rc == 0 %}PASSED{% else %}FAILED (check logs){% endif %}

      - Webserver Health: {% if webserver_health.rc == 0 %}PASSED{% else %}FAILED (check logs){% endif %}

- name: Deploy nginx reverse proxy configuration
  template:
    src: paperless.conf.j2
    dest: "/etc/nginx/conf.d/{{ paperless_domain }}.conf"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload nginx
