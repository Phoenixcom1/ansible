---
# Nextcloud service deployment using Podman Quadlets

- name: Get podman user info
  getent:
    database: passwd
    key: "{{ podman_user }}"
  register: podman_user_info
  changed_when: false

- name: Extract podman user UID and GID
  set_fact:
    podman_user_uid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][1] }}"
    podman_user_gid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][2] }}"
  when: podman_user in podman_user_info.ansible_facts.getent_passwd

- name: Create Nextcloud directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true
  loop:
    - "{{ nextcloud_repo_path }}"
    - "{{ nextcloud_html_dir }}"
    - "{{ nextcloud_db_dir }}"

- name: Create or update Nextcloud env file
  ansible.builtin.copy:
    dest: "{{ nextcloud_env_file }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0600"
    content: |
      POSTGRES_DB={{ nextcloud_db_name }}
      POSTGRES_USER={{ nextcloud_db_user }}
      POSTGRES_PASSWORD={{ nextcloud_db_password }}
      POSTGRES_HOST={{ nextcloud_postgres_container }}
      POSTGRES_PORT=5432
      NEXTCLOUD_ADMIN_USER={{ nextcloud_admin_user }}
      NEXTCLOUD_ADMIN_PASSWORD={{ nextcloud_admin_password }}
      NEXTCLOUD_ADMIN_EMAIL={{ nextcloud_admin_email }}
      NEXTCLOUD_TRUSTED_DOMAINS={{ nextcloud_domain }}
      NEXTCLOUD_TABLE_PREFIX={{ nextcloud_table_prefix }}
      OVERWRITEHOST={{ nextcloud_domain }}
      OVERWRITEPROTOCOL=https
      OVERWRITECLIURL={{ nextcloud_overwritehost }}
      NEXTCLOUD_TALK_SERVER_URL={{ nextcloud_talk_server_url }}
      NEXTCLOUD_TALK_SERVER_PUBLIC_URL={{ nextcloud_talk_server_public_url }}
      NEXTCLOUD_EUROOFFICE_URL={{ nextcloud_eurooffice_url }}
  become: true

- name: Create Quadlet directory for podman user
  file:
    path: "/home/{{ podman_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true

- name: Resolve EuroOffice JWT secret value
  set_fact:
    nextcloud_eurooffice_jwt_secret_effective: "{{ nextcloud_eurooffice_jwt_secret if (nextcloud_eurooffice_jwt_secret | length > 0) else nextcloud_eurooffice_jwt_secret_from_env }}"
  no_log: true
  when: nextcloud_enable_eurooffice

- name: Validate EuroOffice JWT secret format
  assert:
    that:
      - nextcloud_eurooffice_jwt_secret_effective | length <= 128
      - nextcloud_eurooffice_jwt_secret_effective is regex('^[a-zA-Z0-9._-]*$')
    fail_msg: "EuroOffice JWT secret must be max 128 chars and contain only alphanumeric, dots, underscores, or dashes (no spaces or special chars)"
  no_log: true
  when:
    - nextcloud_enable_eurooffice
    - nextcloud_eurooffice_jwt_secret_effective | length > 0

- name: Write EuroOffice JWT secret env file
  copy:
    dest: "{{ nextcloud_eurooffice_jwt_secret_file }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0600"
    content: "{% if nextcloud_eurooffice_jwt_secret_effective | length > 0 %}JWT_SECRET={{ nextcloud_eurooffice_jwt_secret_effective }}{% else %}# No JWT secret configured{% endif %}"
  become: true
  register: eurooffice_secret_env_deployed
  no_log: true
  when: nextcloud_enable_eurooffice

- name: Deploy Nextcloud network Quadlet
  template:
    src: nextcloud.network.j2
    dest: "/home/{{ podman_user }}/.config/containers/systemd/{{ nextcloud_network }}.network"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: network_quadlet_deployed

- name: Deploy Nextcloud Postgres Quadlet container file
  template:
    src: nextcloud-postgres.container.j2
    dest: "/home/{{ podman_user }}/.config/containers/systemd/{{ nextcloud_postgres_container }}.container"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: postgres_quadlet_deployed

- name: Deploy Nextcloud Quadlet container file
  template:
    src: nextcloud.container.j2
    dest: "/home/{{ podman_user }}/.config/containers/systemd/{{ nextcloud_container }}.container"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: nextcloud_quadlet_deployed

- name: Deploy EuroOffice Quadlet container file
  template:
    src: nextcloud-eurooffice.container.j2
    dest: "/home/{{ podman_user }}/.config/containers/systemd/{{ nextcloud_eurooffice_container }}.container"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: eurooffice_quadlet_deployed
  when: nextcloud_enable_eurooffice

- name: Create systemd user directory for Nextcloud stack target
  file:
    path: "/home/{{ podman_user }}/.config/systemd/user"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true

- name: Deploy Nextcloud stack target
  template:
    src: nextcloud-stack.target.j2
    dest: "/home/{{ podman_user }}/.config/systemd/user/{{ nextcloud_systemd_target }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: stack_target_deployed

- name: Enable lingering for podman user
  command: loginctl enable-linger {{ podman_user }}
  become: true
  changed_when: false

- name: Reload systemd user daemon (Quadlet generation)
  systemd:
    daemon_reload: yes
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"

- name: Check if any Quadlet changed
  set_fact:
    any_quadlet_changed: "{{ network_quadlet_deployed.changed or postgres_quadlet_deployed.changed or nextcloud_quadlet_deployed.changed or stack_target_deployed.changed or (eurooffice_quadlet_deployed.changed if nextcloud_enable_eurooffice else False) or (eurooffice_secret_env_deployed.changed if eurooffice_secret_env_deployed is defined else False) }}"

- name: Check if latest-tag restart is required
  set_fact:
    restart_for_latest_tags: "{{ nextcloud_restart_on_latest and (':latest' in nextcloud_image or (nextcloud_enable_eurooffice and ':latest' in nextcloud_eurooffice_image)) }}"

- name: Restart required Nextcloud container services when refresh is required
  systemd:
    name: "{{ item }}"
    state: restarted
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  loop:
    - "{{ nextcloud_postgres_container }}.service"
    - "{{ nextcloud_container }}.service"
  when: any_quadlet_changed or restart_for_latest_tags

- name: Restart optional EuroOffice service when refresh is required
  systemd:
    name: "{{ nextcloud_eurooffice_container }}.service"
    state: restarted
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  register: eurooffice_restart_result
  failed_when: false
  when: nextcloud_enable_eurooffice and (any_quadlet_changed or restart_for_latest_tags)

- name: Warn when EuroOffice service restart failed
  debug:
    msg: |
      EuroOffice service restart failed but core Nextcloud services are running.
      Check details on target host:
      - systemctl --user status {{ nextcloud_eurooffice_container }}.service -l --no-pager
      - journalctl --user -xeu {{ nextcloud_eurooffice_container }}.service
  when:
    - nextcloud_enable_eurooffice
    - eurooffice_restart_result is defined
    - eurooffice_restart_result.failed | default(false)

- name: Ensure optional EuroOffice service is enabled and started
  systemd:
    name: "{{ nextcloud_eurooffice_container }}.service"
    enabled: yes
    state: started
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  failed_when: false
  when: any_quadlet_changed or restart_for_latest_tags

- name: Ensure Nextcloud stack target is enabled and started
  systemd:
    name: "{{ nextcloud_systemd_target }}"
    enabled: yes
    state: started
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"

- name: Deploy nginx reverse proxy configuration
  template:
    src: nextcloud.conf.j2
    dest: "/etc/nginx/conf.d/{{ nextcloud_domain }}.conf"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload nginx

- name: Deploy EuroOffice nginx reverse proxy configuration
  template:
    src: nextcloud-eurooffice.conf.j2
    dest: "/etc/nginx/conf.d/{{ nextcloud_eurooffice_domain }}.conf"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload nginx
  when: nextcloud_enable_eurooffice

- name: Remove legacy EuroOffice nginx config when domain changed
  file:
    path: "/etc/nginx/conf.d/eurooffice.{{ nextcloud_domain }}.conf"
    state: absent
  become: true
  notify: Reload nginx
  when:
    - nextcloud_enable_eurooffice
    - nextcloud_eurooffice_domain != ('eurooffice.' ~ nextcloud_domain)

- name: Configure Nextcloud overwrite protocol via occ
  command: >
    podman exec -u www-data {{ nextcloud_container }}
    php occ config:system:set overwriteprotocol --value=https
  become: true
  become_user: "{{ podman_user }}"
  changed_when: false

- name: Configure Nextcloud overwrite CLI URL via occ
  command: >
    podman exec -u www-data {{ nextcloud_container }}
    php occ config:system:set overwrite.cli.url --value={{ nextcloud_overwritehost }}
  become: true
  become_user: "{{ podman_user }}"
  changed_when: false

- name: Configure WOPI allowlist for EuroOffice subnet
  command: >
    podman exec -u www-data {{ nextcloud_container }}
    php occ config:app:set richdocuments wopi_allowlist --value={{ nextcloud_wopi_allowlist }}
  become: true
  become_user: "{{ podman_user }}"
  changed_when: false
  when: nextcloud_enable_eurooffice and nextcloud_wopi_allowlist | length > 0

- name: Sync EuroOffice JWT secret to Nextcloud richdocuments
  shell: |
    SECRET=$(grep '^JWT_SECRET=' {{ nextcloud_eurooffice_jwt_secret_file }} | cut -d= -f2-)
    if [ -n "$SECRET" ]; then
      podman exec -u www-data {{ nextcloud_container }} php occ config:app:set richdocuments jwt_secret --value="$SECRET"
      podman exec -u www-data {{ nextcloud_container }} php occ config:app:set richdocuments jwt_header --value="{{ nextcloud_eurooffice_jwt_header }}"
    fi
  become: true
  become_user: "{{ podman_user }}"
  changed_when: false
  no_log: true
  when: nextcloud_enable_eurooffice and nextcloud_eurooffice_jwt_enabled | bool

- name: Display Nextcloud deployment result
  debug:
    msg: |
      Nextcloud deployed successfully via Podman Quadlet!
      - Postgres Quadlet: ~/.config/containers/systemd/{{ nextcloud_postgres_container }}.container
      - Nextcloud Quadlet: ~/.config/containers/systemd/{{ nextcloud_container }}.container
      - Service: {{ nextcloud_container }}.service
      - Domain: https://{{ nextcloud_domain }}
