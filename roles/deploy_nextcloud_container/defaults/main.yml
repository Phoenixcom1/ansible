---
# Nextcloud service deployment configuration

# Podman user and service path
podman_user: "{{ podman_username }}"
nextcloud_repo_path: "{{ podman_service_dir }}/nextcloud"
nextcloud_html_dir: "{{ nextcloud_repo_path }}/html"
nextcloud_env_file: "{{ nextcloud_repo_path }}/nextcloud.env"
nextcloud_db_dir: "{{ nextcloud_repo_path }}/postgres"

# Nextcloud application settings
nextcloud_domain: "cloud.kerberos.bitsnbyt.es"
nextcloud_port: 8080
nextcloud_internal_port: 80
nextcloud_admin_user: "admin"
nextcloud_admin_password: "nextcloud"
nextcloud_admin_email: "admin@kerberos.bitsnbyt.es"
nextcloud_overwritehost: "https://{{ nextcloud_domain }}"
nextcloud_table_prefix: "oc_"

# Database configuration
nextcloud_db_name: "nextcloud"
nextcloud_db_user: "nextcloud"
nextcloud_db_password: "nextcloud"
nextcloud_postgres_container: "nextcloud-postgres"
nextcloud_container: "nextcloud"

# Podman network and stack coordination
nextcloud_network: "nextcloud_net"
nextcloud_systemd_target: "nextcloud-stack.target"
nextcloud_dns_server: "{{ dns_primary_nameserver }}"

# Images
nextcloud_image: "docker.io/nextcloud:latest"
postgres_image: "docker.io/postgres:16-alpine"
nextcloud_pull_policy: "always"
nextcloud_restart_on_latest: true

# EuroOffice integration
nextcloud_enable_eurooffice: true
nextcloud_eurooffice_container: "nextcloud-eurooffice"
nextcloud_eurooffice_image: "ghcr.io/euro-office/documentserver:latest"
nextcloud_eurooffice_domain: "eurooffice.kerberos.bitsnbyt.es"
nextcloud_eurooffice_url: "https://{{ nextcloud_eurooffice_domain }}"
nextcloud_eurooffice_nextcloud_app: "eurooffice"
nextcloud_eurooffice_jwt_enabled: true
nextcloud_eurooffice_jwt_header: "Authorization"
nextcloud_eurooffice_jwt_secret: ""
nextcloud_eurooffice_jwt_secret_env_var: "NEXTCLOUD_EUROOFFICE_JWT_SECRET"
nextcloud_eurooffice_jwt_secret_from_env: "{{ lookup('env', nextcloud_eurooffice_jwt_secret_env_var) | default('', true) }}"
nextcloud_eurooffice_jwt_secret_file: "{{ nextcloud_repo_path }}/eurooffice-jwt.env"
nextcloud_eurooffice_internal_host_alias_enabled: true
nextcloud_host_containers_internal_ip: "169.254.1.2"
nextcloud_wopi_allowlist: "10.89.0.0/24"

# External Talk server integration
nextcloud_talk_server_url: ""
nextcloud_talk_server_public_url: ""
