---
# Homepage service deployment using Podman systemd approach

# Discover podman user's UID and GID
- name: Get podman user info
  getent:
    database: passwd
    key: "{{ podman_user }}"
  register: podman_user_info
  changed_when: false

- name: Extract podman user UID and GID
  set_fact:
    podman_user_uid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][1] }}"
    podman_user_gid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][2] }}"
  when: podman_user in podman_user_info.ansible_facts.getent_passwd

# Discover podman bridge gateway (dynamic, no hardcoding)
- name: Discover podman bridge gateway
  shell: |
    podman network inspect {{ podman_network }} --format='{% raw %}{{ (index .Subnets 0).Gateway }}{% endraw %}'
  become: true
  become_user: "{{ podman_user }}"
  register: podman_gateway_result
  changed_when: false
  ignore_errors: true

- name: Set podman bridge gateway fact
  set_fact:
    podman_bridge_gateway: "{{ podman_gateway_result.stdout | trim }}"
  when:
    - podman_gateway_result is defined
    - podman_gateway_result.rc == 0
    - podman_gateway_result.stdout | length > 0

# Fallback to default if discovery fails
- name: Set default gateway if discovery failed
  set_fact:
    podman_bridge_gateway: "10.89.1.1"
  when: >
    podman_gateway_result is not defined or
    podman_gateway_result.rc != 0 or
    (podman_gateway_result.stdout | default('') | length == 0)

# Create config directories
- name: Check if homepage config directory exists
  stat:
    path: "{{ homepage_config_dir }}"
  register: homepage_config_stat

- name: Create homepage config directory if missing
  file:
    path: "{{ homepage_config_dir }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true
  when: not homepage_config_stat.stat.exists

- name: Check if .env file exists
  stat:
    path: "{{ homepage_config_dir }}/.env"
  register: homepage_env_stat

- name: Create empty .env file if missing
  copy:
    content: |
      # Homepage environment variables
      HOMEPAGE_VAR_PODMAN_BRIDGE_GATEWAY={{ podman_bridge_gateway }}
    dest: "{{ homepage_config_dir }}/.env"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  when: not homepage_env_stat.stat.exists

# Create Quadlet directory (Podman systemd units)
- name: Create Quadlet directory for podman user
  file:
    path: "/home/{{ podman_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true

# Deploy Quadlet container file
- name: Deploy homepage Quadlet container file
  template:
    src: homepage.container.j2
    dest: "/home/{{ podman_user }}/.config/containers/systemd/homepage.container"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: quadlet_deployed

# Enable lingering for podman user (allows user services to run without login)
- name: Enable lingering for podman user
  command: loginctl enable-linger {{ podman_user }}
  become: true
  changed_when: false

# Reload systemd daemon to pick up Quadlet changes
- name: Reload systemd user daemon (Quadlet generation)
  systemd:
    daemon_reload: yes
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"

# Restart service if Quadlet changed, otherwise ensure it's enabled and started
- name: Restart homepage service (Quadlet changed)
  systemd:
    name: homepage
    state: restarted
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  when: quadlet_deployed.changed

- name: Ensure homepage service is enabled and started
  systemd:
    name: homepage
    enabled: yes
    state: started
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  when: not quadlet_deployed.changed

# Fix ownership of mounted volumes
- name: Fix config directory ownership (for podman user access)
  file:
    path: "{{ homepage_config_dir }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
    recurse: yes
  become: true

- name: Display homepage deployment result
  debug:
    msg: |
      Homepage deployed successfully via Podman Quadlet!
      - Quadlet: ~/.config/containers/systemd/homepage.container
      - Service: homepage.service (auto-generated by systemd)
      - Accessible at: https://{{ homepage_domain }}
      - Auto-update: Enabled (via AutoUpdate=registry in Quadlet)
      - Manage: systemctl --user status homepage
      - View Quadlet: podman --user systemctl cat homepage

# Deploy nginx reverse proxy configuration
- name: Ensure nginx conf.d directory exists
  file:
    path: /etc/nginx/conf.d
    state: directory
    mode: 0755
  become: true

- name: Deploy homepage nginx reverse proxy config
  template:
    src: homepage.conf.j2
    dest: /etc/nginx/conf.d/homepage.conf
    mode: "0644"
  notify: reload nginx
  become: true
