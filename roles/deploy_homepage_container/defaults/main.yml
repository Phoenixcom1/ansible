---
# Homepage service deployment configuration

# Compose file settings
homepage_compose_file: compose_homepage.yml
homepage_compose_template: compose_homepage.yml.j2
homepage_repo_path: "{{ podman_service_dir }}/homepage"
homepage_project_name: homepage

# Volume and config paths
homepage_config_dir: "{{podman_service_dir}}/{{homepage_project_name}}/config"
homepage_env_file: "{{ homepage_config_dir }}/.env"

# Homepage application settings
homepage_allowed_hosts: "homepage.{{ customer_domain }}"

# Podman user and network
podman_user: "{{podman_username}}"
podman_network: "podman" # Podman's built-in rootless bridge network

# Podman bridge gateway (discovered dynamically by the role)
podman_bridge_gateway: "10.89.1.1" # Default fallback if discovery fails

# Homepage reverse proxy
homepage_domain: "homepage.{{ customer_domain }}"
homepage_port: 3000
