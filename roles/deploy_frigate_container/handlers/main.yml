---
# Handlers for frigate service
- name: reload nginx
  systemd:
    name: nginx
    state: reloaded
  become: true

- name: Reload systemd user daemon
  systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
