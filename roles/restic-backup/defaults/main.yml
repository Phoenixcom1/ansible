---
# Restic backup configuration

# Restic repository location (NAS mount point)
# This should be a mounted network share or local directory
restic_repository: "/mnt/backup/restic-podman"

# Restic password file location (for encryption)
restic_password_file: "/root/.restic-password"

# Backup schedule (systemd timer format)
restic_backup_time: "*-*-* 02:00:00" # Daily at 2 AM

# Services to backup (each service has its own backup paths)
restic_backup_services:
  homepage:
    enabled: true
    paths:
      - "{{ podman_service_dir }}/homepage"
    excludes:
      - "*.log"

  unifi:
    enabled: true
    # Strategy: Backup only UniFi's built-in autobackup files
    # UniFi creates .unf backup files automatically, no need for live DB backup
    paths:
      - "{{ podman_service_dir }}/unifi/data/backup/autobackup"
    excludes:
      - "*.log"

  paperless:
    enabled: true
    paths:
      # Primary backup: export (created by document_exporter)
      - "{{ podman_service_dir }}/paperless/export"

      # Media contains originals + OCR'd versions - most important!
      #- "{{ podman_service_dir }}/paperless/media"
      # Optional: backup data dir too (SQLite + index) for faster restore
      # Comment out if you only want export-based backups
      #- "{{ podman_service_dir }}/paperless/data"
      # Custom scripts and init files (if modified)
      - "{{ podman_service_dir }}/paperless/scripts"
      - "{{ podman_service_dir }}/paperless/custom-cont-init.d"
    excludes:
      - "*/redisdata/*" # Redis cache - can be regenerated
      - "*/consume/*" # Network mount - backed up elsewhere
      - "*.log"
      - "*/thumbnails/*" # Can be regenerated

  vaultwarden:
    enabled: true
    # Strategy: Stop container before backup (passwords are critical)
    stop_before_backup: true
    compose_file: "{{ podman_service_dir }}/vaultwarden/compose_vaultwarden.yml"
    project_name: vaultwarden
    paths:
      - "{{ podman_service_dir }}/vaultwarden/data"
    excludes:
      - "*.log"
      - "*/icon_cache/*" # Website icons - can be re-downloaded

  jellyfin:
    enabled: true
    # Strategy: Stop container before backup (SQLite database)
    stop_before_backup: true
    compose_file: "{{ podman_service_dir }}/jellyfin/compose_jellyfin.yml"
    project_name: jellyfin
    paths:
      - "{{ podman_service_dir }}/jellyfin/config"
    excludes:
      - "*/cache/*" # Transcoding cache - regenerated
      - "*/transcodes/*" # Temporary transcodes
      - "*/log/*" # Log files
      - "*.log"

  frigate:
    enabled: true
    # Strategy: Stop container before backup (SQLite database)
    stop_before_backup: true
    compose_file: "{{ podman_service_dir }}/frigate/compose_frigate.yml"
    project_name: frigate
    paths:
      - "{{ podman_service_dir }}/frigate/config"
      # Optional: backup recent recordings (comment out if too large)
      #- "{{ podman_service_dir }}/frigate/media"
    excludes:
      - "*/clips/*" # Event clips - can be large, optionally backup separately
      - "*/recordings/*" # Continuous recordings - very large, usually backed up elsewhere
      - "*/cache/*" # Thumbnail cache - regenerated
      - "*.log"

  immich:
    enabled: true
    # Strategy: Stop containers before backup (PostgreSQL database + uploaded photos)
    stop_before_backup: true
    compose_file: "{{ podman_service_dir }}/immich/compose_immich.yml"
    project_name: immich
    paths:
      - "{{ podman_service_dir }}/immich/upload" # User-uploaded photos and videos
      - "{{ podman_service_dir }}/immich/postgres" # PostgreSQL database with metadata
      - "{{ podman_service_dir }}/immich/immich.env" # Configuration with secrets
    excludes:
      - "*/model-cache/*" # ML models - can be re-downloaded
      - "*/redis/*" # Redis cache - can be regenerated
      - "*/library/*" # External network mount - backed up elsewhere
      - "*/thumbs/*" # Thumbnails - can be regenerated
      - "*/encoded-video/*" # Transcoded videos - can be regenerated
      - "*.log"

# Global excludes (applied to all backups)
restic_global_excludes:
  - "*/cache/*"
  - "*/tmp/*"
  - "*.log"

# Retention policy
restic_keep_daily: 7
restic_keep_weekly: 4
restic_keep_monthly: 12

# NAS mount configuration (optional - if not already mounted)
restic_nas_enabled: true
restic_nas_source: "//datenbunker.local/Service_Backups"
restic_nas_mount_point: "/mnt/backup"
restic_nas_credentials: "/root/.smb_restic_creds"
restic_nas_mount_options: "vers=3.1.1,_netdev,credentials={{ restic_nas_credentials }},uid=0,gid=0,file_mode=0600,dir_mode=0700"
