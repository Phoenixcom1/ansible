---
# Restic backup configuration

# Restic repositories are kept on the shared TrueNAS NFS dataset. A distinct
# directory per inventory host prevents repositories from being shared.
restic_repository: "{{ restic_nas_mount_point }}/restic-{{ inventory_hostname }}"

# Restic password file location (for encryption)
restic_password_file: "/root/.restic-password"
# The dedicated NFS export maps root only for its authorized backup host, so
# the established root-owned password file and service identity are retained.
restic_backup_user: root
restic_backup_group: root

# Optional HTTP basic auth for the primary destination, only needed when
# restic_repository points at a "rest:" backend that requires it. Leave
# restic_rest_username empty to skip (the default NAS-backed repository
# doesn't need this).
restic_rest_username: ""
restic_rest_password: ""
restic_rest_credentials_file: "/root/.restic-rest-creds"

# Bounds how long a single restic invocation (init/backup/forget/stats) may
# run against any one destination. Prevents an unreachable/hung destination
# (e.g. an offline REST server) from blocking the whole backup run instead of
# just failing that destination.
restic_command_timeout_seconds: 1800

# Backup schedule (systemd timer format)
restic_backup_time: "*-*-* 02:00:00" # Daily at 2 AM

# The timer runs daily; services remain opt-in through this inventory-overridable
# list while their paths and behavior stay defined below.
restic_enable_timer: true
restic_backup_enabled_services: []

# Per-host override of specific keys (paths, excludes, destinations, etc.)
# in a restic_backup_services entry, without having to redefine the whole
# service. Useful when a service's real data location differs from this
# role's default guess, or to route only some services off-site. Example:
# restic_service_overrides:
#   immich:
#     destinations:
#       - rest-offsite
#     paths:
#       - /srv/containers/immich-data
restic_service_overrides: {}

# Services to backup (each service has its own backup paths)
restic_backup_services:
  homepage:
    paths:
      - "{{ podman_service_dir }}/homepage"
    excludes:
      - "*.log"

  unifi:
    # Strategy: Backup only UniFi's built-in autobackup files
    # UniFi creates .unf backup files automatically, no need for live DB backup
    paths:
      - "{{ podman_service_dir }}/unifi/data/backup/autobackup"
    excludes:
      - "*.log"

  paperless:
    paths:
      # Primary backup: export (created by document_exporter)
      - "{{ podman_service_dir }}/paperless/export"

      # Media contains originals + OCR'd versions - most important!
      #- "{{ podman_service_dir }}/paperless/media"
      # Optional: backup data dir too (SQLite + index) for faster restore
      # Comment out if you only want export-based backups
      #- "{{ podman_service_dir }}/paperless/data"
      # Custom scripts and init files (if modified)
      - "{{ podman_service_dir }}/paperless/scripts"
      - "{{ podman_service_dir }}/paperless/custom-cont-init.d"
    excludes:
      - "*/redisdata/*" # Redis cache - can be regenerated
      - "*/consume/*" # Network mount - backed up elsewhere
      - "*.log"
      - "*/thumbnails/*" # Can be regenerated

  vaultwarden:
    # Strategy: Stop container before backup (passwords are critical)
    stop_before_backup: true
    # Quadlet-managed services are stopped through the owning user manager.
    systemd_user_unit: vaultwarden.service
    systemd_user: "{{ podman_username }}"
    compose_file: "{{ podman_service_dir }}/vaultwarden/compose_vaultwarden.yml"
    project_name: vaultwarden
    paths:
      - "{{ podman_service_dir }}/vaultwarden/data"
    excludes:
      - "*.log"
      - "*/icon_cache/*" # Website icons - can be re-downloaded

  jellyfin:
    # Strategy: Stop container before backup (SQLite database)
    stop_before_backup: true
    compose_file: "{{ podman_service_dir }}/jellyfin/compose_jellyfin.yml"
    project_name: jellyfin
    paths:
      - "{{ podman_service_dir }}/jellyfin/config"
    excludes:
      - "*/cache/*" # Transcoding cache - regenerated
      - "*/transcodes/*" # Temporary transcodes
      - "*/log/*" # Log files
      - "*.log"

  frigate:
    # Strategy: Stop container before backup (SQLite database)
    stop_before_backup: true
    compose_file: "{{ podman_service_dir }}/frigate/compose_frigate.yml"
    project_name: frigate
    paths:
      - "{{ podman_service_dir }}/frigate/config"
      # Optional: backup recent recordings (comment out if too large)
      #- "{{ podman_service_dir }}/frigate/media"
    excludes:
      - "*/clips/*" # Event clips - can be large, optionally backup separately
      - "*/recordings/*" # Continuous recordings - very large, usually backed up elsewhere
      - "*/cache/*" # Thumbnail cache - regenerated
      - "*.log"

  immich:
    # Strategy: Stop containers before backup (PostgreSQL database + uploaded photos)
    stop_before_backup: true
    compose_file: "{{ podman_service_dir }}/immich/compose_immich.yml"
    project_name: immich
    # Optional: restrict this service to a subset of restic_all_destinations
    # (by "name"), instead of backing up to every configured destination.
    # Useful when a service already has its own backup elsewhere and only
    # needs the secondary/off-site copy from this role.
    # destinations:
    #   - rest-offsite
    paths:
      - "{{ podman_service_dir }}/immich/upload" # User-uploaded photos and videos
      - "{{ podman_service_dir }}/immich/postgres" # PostgreSQL database with metadata
      - "{{ podman_service_dir }}/immich/immich.env" # Configuration with secrets
    excludes:
      - "*/model-cache/*" # ML models - can be re-downloaded
      - "*/redis/*" # Redis cache - can be regenerated
      - "*/library/*" # External network mount - backed up elsewhere
      - "*/thumbs/*" # Thumbnails - can be regenerated
      - "*/encoded-video/*" # Transcoded videos - can be regenerated
      - "*.log"

# Global excludes (applied to all backups)
restic_global_excludes:
  - "*/cache/*"
  - "*/tmp/*"
  - "*.log"

# Retention policy
restic_keep_daily: 7
restic_keep_weekly: 4
restic_keep_monthly: 12

# TrueNAS SMB mount configuration. The share and dedicated account are
# provisioned by truenas_smb_provision.
restic_nas_enabled: true
restic_nas_fstype: cifs
restic_nas_server: "truenas.{{ customer_domain }}"
restic_nas_share_name: "podman-backups"
restic_nas_source: "//{{ restic_nas_server }}/{{ restic_nas_share_name }}"
restic_nas_mount_point: "/mnt/backup"
restic_nas_credentials: "/root/.smb_restic_creds"
restic_nas_username: "restic-backup"
restic_nas_password: "{{ truenas_restic_smb_password | default('', true) }}"
restic_nas_mount_options: "vers=3.1.1,_netdev,credentials={{ restic_nas_credentials }},uid=0,gid=0,file_mode=0600,dir_mode=0700"

# Additional backup destinations, backed up to alongside the primary
# restic_repository/NAS above. Every enabled service is backed up to each
# destination in this list in turn. Each destination needs its own restic
# repository and password file; if it lives on its own NAS share, define its
# own "nas" mount settings too (omit "nas" entirely to reuse an already
# mounted path, e.g. a local disk). Each destination may also set its own
# "command_timeout_seconds", overriding restic_command_timeout_seconds -
# handy for a flaky/being-set-up destination that shouldn't retry for the
# full default duration before failing.
restic_additional_destinations: []
