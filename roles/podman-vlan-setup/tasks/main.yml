---
# Configure VLAN 100 + Podman network

# --------------------------------------------------------------------
# Detect default interface dynamically (VM-safe, no shell pipes)
# --------------------------------------------------------------------
- name: Gather facts
  setup:

# - name: Set parent interface fact
#   set_fact:
#     parent_iface: "{{ ansible_default_ipv4.interface }}"

# - name: Set VLAN interface name fact
#   set_fact:
#     vlan_iface: "{{ parent_iface }}.{{ vlan_id }}"

# Enable lingering for podman user to support systemd user session
- name: Enable lingering for podman user
  command: loginctl enable-linger {{ podman_user | default('podman') }}
  become: true
  ignore_errors: true
  changed_when: false

#######################################################################
# SYSTEMD-NETWORKD HEALTH CHECK
#######################################################################

- name: Ensure systemd-networkd service exists
  command: systemctl status systemd-networkd
  register: networkd_status
  failed_when: networkd_status.rc not in [0, 3] # 3 = service not running
  changed_when: false

- name: Ensure systemd-networkd is enabled
  systemd:
    name: systemd-networkd
    enabled: yes

- name: Ensure systemd-networkd is running
  systemd:
    name: systemd-networkd
    state: started

- name: Install VLAN package
  apt:
    name: vlan
    state: present
    update_cache: yes
  become: true

- name: Check if 8021q kernel module is loaded
  command: cat /proc/modules
  register: proc_modules
  changed_when: false

- name: Load 8021q kernel module if not already loaded
  modprobe:
    name: 8021q
    state: present
  become: true
  when: "'8021q ' not in proc_modules.stdout"

- name: Ensure 8021q module is persisted across reboots
  lineinfile:
    path: /etc/modules-load.d/8021q.conf
    line: "8021q"
    create: yes
    owner: root
    group: root
    mode: 0644
  become: true

