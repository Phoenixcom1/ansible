#######################################################################
# Create Podman bridge network for containers
#######################################################################

- name: Check if Podman network exists (as podman user)
  command: podman network inspect {{ podman_network }}
  become: true
  become_user: "{{ podman_user | default('podman') }}"
  register: podman_network_exists
  ignore_errors: true
  changed_when: false

- name: Create Podman bridge network if missing (as podman user)
  command: >
    podman network create
    --driver bridge
    {{ podman_network }}
  become: true
  become_user: "{{ podman_user | default('podman') }}"
  when: podman_network_exists.rc != 0
  register: network_creation
  failed_when: network_creation.rc != 0 and "already exists" not in network_creation.stderr

- name: Verify Podman network exists (as podman user)
  command: podman network inspect {{ podman_network }}
  become: true
  become_user: "{{ podman_user | default('podman') }}"
  changed_when: false
