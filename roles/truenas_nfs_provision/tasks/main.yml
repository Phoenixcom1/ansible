---
- name: Validate TrueNAS NFS provisioning configuration
  assert:
    that:
      - truenas_api_token | length > 0
      - truenas_nfs_dataset_encryption_passphrase | length > 0 or not (truenas_nfs_provision_shares | selectattr('encrypted', 'defined') | selectattr('encrypted') | list | length > 0)
  no_log: true
  when: truenas_nfs_provision_shares | length > 0

- name: Get podman user identity for TrueNAS dataset permissions
  getent:
    database: passwd
    key: "{{ podman_username }}"
  register: truenas_nfs_podman_user
  changed_when: false
  when:
    - truenas_nfs_provision_shares | length > 0
    - truenas_nfs_manage_dataset_permissions | bool

- name: Initialize the TrueNAS NFS JSON-RPC provisioning policy
  set_fact:
    truenas_nfs_jsonrpc_datasets: []
    truenas_nfs_jsonrpc_permissions: []
    truenas_nfs_jsonrpc_shares: []
  when: truenas_nfs_provision_shares | length > 0

- name: Add TrueNAS NFS dataset parents to the JSON-RPC policy
  set_fact:
    truenas_nfs_jsonrpc_datasets: "{{ truenas_nfs_jsonrpc_datasets + [{'name': item, 'share_type': 'GENERIC'}] }}"
  loop: "{{ truenas_nfs_dataset_parents }}"
  when: truenas_nfs_provision_shares | length > 0

- name: Add TrueNAS NFS datasets to the JSON-RPC policy
  set_fact:
    truenas_nfs_jsonrpc_datasets: "{{ truenas_nfs_jsonrpc_datasets + [dataset_policy] }}"
  vars:
    dataset_policy:
      name: "{{ item.dataset }}"
      share_type: GENERIC
      encryption: "{{ item.encrypted | default(false) | bool }}"
      encryption_options:
        generate_key: false
        passphrase: "{{ truenas_nfs_dataset_encryption_passphrase }}"
        algorithm: "{{ truenas_nfs_dataset_encryption_algorithm }}"
        pbkdf2iters: "{{ truenas_nfs_dataset_encryption_pbkdf2iters | int }}"
  loop: "{{ truenas_nfs_provision_shares }}"
  no_log: true
  when: truenas_nfs_provision_shares | length > 0

- name: Add TrueNAS NFS permissions to the JSON-RPC policy
  set_fact:
    truenas_nfs_jsonrpc_permissions: "{{ truenas_nfs_jsonrpc_permissions + [permission_policy] }}"
  vars:
    permission_policy:
      path: "{{ item.export_path }}"
      uid: "{{ item.owner_uid | default(truenas_nfs_podman_user.ansible_facts.getent_passwd[podman_username][1]) | int }}"
      gid: "{{ item.owner_gid | default(truenas_nfs_podman_user.ansible_facts.getent_passwd[podman_username][2]) | int }}"
      mode: "{{ item.mode | default(truenas_nfs_dataset_mode) }}"
      options:
        recursive: false
        traverse: false
        stripacl: true
  loop: "{{ truenas_nfs_provision_shares }}"
  when:
    - truenas_nfs_provision_shares | length > 0
    - truenas_nfs_manage_dataset_permissions | bool

- name: Add TrueNAS NFS shares to the JSON-RPC policy
  set_fact:
    truenas_nfs_jsonrpc_shares: "{{ truenas_nfs_jsonrpc_shares + [share_policy] }}"
  vars:
    share_policy:
      type: nfs
      path: "{{ item.export_path }}"
      hosts: "{{ item.allowed_hosts | default([static_ip]) }}"
      comment: "Managed by Ansible: {{ item.dataset }}"
  loop: "{{ truenas_nfs_provision_shares }}"
  when: truenas_nfs_provision_shares | length > 0

- name: Configure TrueNAS NFS resources through JSON-RPC
  include_role:
    name: truenas_jsonrpc_provision
  vars:
    truenas_jsonrpc_provision_policy:
      datasets: "{{ truenas_nfs_jsonrpc_datasets }}"
      permissions: "{{ truenas_nfs_jsonrpc_permissions }}"
      shares: "{{ truenas_nfs_jsonrpc_shares }}"
      services: [nfs]
  when: truenas_nfs_provision_shares | length > 0

- name: Select periodic snapshot policies for managed NFS datasets
  set_fact:
    truenas_nfs_managed_snapshot_policies: >-
      {{ truenas_nfs_snapshot_retention_policies
         | selectattr('dataset', 'in', truenas_nfs_provision_shares | map(attribute='dataset') | list)
         | list }}
  when: truenas_nfs_provision_shares | length > 0

- name: Configure TrueNAS periodic snapshots for managed NFS datasets
  include_role:
    name: truenas_snapshot_retention
  vars:
    truenas_snapshot_retention_policies: "{{ truenas_nfs_managed_snapshot_policies }}"
  when: truenas_nfs_managed_snapshot_policies | default([]) | length > 0
