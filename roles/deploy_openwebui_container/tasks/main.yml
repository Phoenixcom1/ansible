---
# Open WebUI service deployment using Podman Quadlets

# Discover podman user's UID and GID
- name: Get podman user info
  getent:
    database: passwd
    key: "{{ podman_user }}"
  register: podman_user_info
  changed_when: false

- name: Extract podman user UID and GID
  set_fact:
    podman_user_uid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][1] }}"
    podman_user_gid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][2] }}"
  when: podman_user in podman_user_info.ansible_facts.getent_passwd

# Create Quadlet directory (Podman systemd units)
- name: Create Quadlet directory for podman user
  file:
    path: "/home/{{ podman_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true

# Deploy Quadlet file
- name: Deploy Open WebUI Quadlet file
  template:
    src: openwebui.container.j2
    dest: "/home/{{ podman_user }}/.config/containers/systemd/openwebui.container"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: quadlet_deployed

# Enable lingering for podman user (allows user services to run without login)
- name: Enable lingering for podman user
  command: loginctl enable-linger {{ podman_user }}
  become: true
  changed_when: false

# Reload systemd daemon to pick up Quadlet changes
- name: Reload systemd user daemon (Quadlet generation)
  systemd:
    daemon_reload: yes
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"

# Ensure service is enabled and started
- name: Ensure openwebui service is enabled and started
  systemd:
    name: openwebui
    enabled: yes
    state: started
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"

# Restart only if Quadlet file changed (after service is created)
- name: Restart openwebui service (Quadlet changed)
  systemd:
    name: openwebui
    state: restarted
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  when: quadlet_deployed.changed

- name: Display Open WebUI deployment result
  debug:
    msg: |
      Open WebUI deployed successfully via Podman Quadlet!
      - Quadlet: ~/.config/containers/systemd/openwebui.container
      - Service: openwebui.service (auto-generated by systemd)
      - Web UI: http://{{ ansible_default_ipv4.address }}:{{ openwebui_host_port }}
      - Domain: https://{{ openwebui_domain }} (if nginx configured)
      - Volume: {{ openwebui_volume_name }}
      - Auto-update: Enabled (via AutoUpdate=registry in Quadlet)
      - Manage: systemctl --user status openwebui
      - View logs: journalctl --user -u openwebui -f

# Check if nginx reverse proxy role has been executed
- name: Check if nginx config directory exists
  stat:
    path: "/etc/nginx/conf.d"
  register: nginx_config_dir

# Deploy nginx reverse proxy configuration
- name: Deploy Open WebUI nginx reverse proxy config
  template:
    src: openwebui.conf.j2
    dest: /etc/nginx/conf.d/openwebui.conf
    mode: "0644"
  notify: reload nginx
  become: true
  when: nginx_config_dir.stat.exists

# Ensure podman auto-update timer is enabled
- name: Enable podman auto-update timer for podman user
  systemd:
    name: podman-auto-update.timer
    state: started
    enabled: yes
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
