---
# AdGuardHome Sync service deployment configuration

# Application settings
adguardhome_sync_domain: "adguardhome-sync.{{ customer_domain }}"
adguardhome_sync_client_url: "https://{{ adguardhome_sync_domain }}"
adguardhome_sync_image: "ghcr.io/bakito/adguardhome-sync:latest"
adguardhome_sync_auto_update: true
adguardhome_sync_api_port: 8082
podman_containers_systemd_dir: "/home/{{ podman_user }}/.config/containers/systemd"

# Data directory for config
adguardhome_sync_config_dir: "{{ podman_service_dir }}/adguardhome-sync"

# Cron schedule for sync (default: every 2 hours)
adguardhome_sync_cron: "0 */2 * * *"
adguardhome_sync_run_on_start: true
adguardhome_sync_continue_on_error: false

# Origin AdGuard Home instance (primary)
adguardhome_sync_origin_url: "http://192.168.1.249" # Local AdGuard Home container
adguardhome_sync_username: "Enno"
adguardhome_sync_password: "{{ vault_adguardhome_password }}"
adguardhome_sync_origin_username: "{{ adguardhome_sync_username }}"
adguardhome_sync_origin_password: "{{ adguardhome_sync_password }}"

# Replica AdGuard Home instances
adguardhome_sync_replicas: []

# API settings
adguardhome_sync_api_enabled: true
adguardhome_sync_api_username: "{{ adguardhome_sync_username }}"
adguardhome_sync_api_password: "{{ adguardhome_sync_password }}"
adguardhome_sync_api_dark_mode: true

# Feature flags (sync options)
adguardhome_sync_features:
  dns:
    accessLists: true
    serverConfig: true
    rewrites: true
  dhcp:
    serverConfig: false # Usually don't sync DHCP between instances
    staticLeases: false
  generalSettings: true
  queryLogConfig: true
  statsConfig: true
  clientSettings: true
  services: true
  filters: true
  theme: true
  tlsConfig: false

# Podman user and network
podman_user: "{{ podman_username }}"
adguardhome_network: "adguardhome_net"
# Additional existing Podman networks used by replica instances
adguardhome_sync_additional_networks: []
