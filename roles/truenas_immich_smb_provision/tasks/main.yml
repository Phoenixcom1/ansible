---
- name: Validate TrueNAS Immich SMB configuration
  assert:
    that:
      - truenas_immich_smb_api_token | length > 0
      - truenas_immich_smb_password | length > 0
  no_log: true

- name: Configure TrueNAS Immich SMB resources through JSON-RPC
  include_role:
    name: truenas_jsonrpc_provision
  vars:
    truenas_jsonrpc_provision_api_url: "{{ truenas_immich_smb_api_url }}"
    truenas_jsonrpc_provision_api_token: "{{ truenas_immich_smb_api_token }}"
    truenas_jsonrpc_provision_api_validate_certs: "{{ truenas_immich_smb_api_validate_certs }}"
    truenas_jsonrpc_provision_policy:
      datasets:
        - name: "{{ truenas_immich_smb_dataset }}"
          create: false
      users:
        - username: "{{ truenas_immich_smb_username }}"
          full_name: "Immich media account"
          password: "{{ truenas_immich_smb_password }}"
      permissions:
        - path: "{{ truenas_immich_smb_export_path }}"
          user: "{{ truenas_immich_smb_username }}"
          mode: "0770"
          options:
            recursive: true
            traverse: true
            stripacl: true
      shares:
        - type: smb
          path: "{{ truenas_immich_smb_export_path }}"
          name: "{{ truenas_immich_smb_share_name }}"
          comment: "Managed by Ansible: Immich media"
      services: [cifs]

- name: Configure TrueNAS periodic snapshots for the Immich dataset
  include_role:
    name: truenas_snapshot_retention
  vars:
    truenas_snapshot_retention_api_url: "{{ truenas_immich_smb_api_url }}"
    truenas_snapshot_retention_api_token: "{{ truenas_immich_smb_api_token }}"
    truenas_snapshot_retention_api_validate_certs: "{{ truenas_immich_smb_api_validate_certs }}"
    truenas_snapshot_retention_policies: "{{ truenas_immich_smb_snapshot_policies }}"
