---
#Linux common tasks

- name: Update all packages to their latest version
  become: true
  ansible.builtin.package:
    name: "*"
    state: latest

- name: Install Linux Standard Base
  ansible.builtin.apt:
    name: lsb-release
  become: true
  when:
    - ansible_distribution | string == 'Ubuntu'
    - ansible_distribution_release | string == 'noble'

- name: Install Curl
  ansible.builtin.package:
    name: curl
  become: true

- name: Install avahi-daemon for mDNS (.local) domain resolution
  ansible.builtin.package:
    name: avahi-daemon
  become: true

- name: Ensure avahi-daemon is enabled and running
  ansible.builtin.systemd:
    name: avahi-daemon
    enabled: yes
    state: started
  become: true

# spin-off project of FreeRDP
- name: Install winpr
  ansible.builtin.package:
    name: winpr-utils
  become: true

- name: Add user to kvm groupe
  become: true
  ansible.builtin.user:
    name: "{{ local_username }}"
    groups: kvm
    append: yes

- name: Set timezone
  become: true
  ansible.builtin.command:
    cmd: "timedatectl set-timezone {{ timezone }}"

# Copy SMB credentials file from controller if available
- name: Check if .smbcredentials exists on controller
  stat:
    path: "{{ lookup('env', 'HOME') }}/.smbcredentials"
  register: smbcreds_controller
  delegate_to: localhost
  become: false
  changed_when: false

- name: Copy .smbcredentials file to target root home
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/.smbcredentials"
    dest: /root/.smbcredentials
    owner: root
    group: root
    mode: "0600"
  become: true
  when: smbcreds_controller.stat.exists
  register: smbcreds_copied

- name: Display SMB credentials copy status
  debug:
    msg: ".smbcredentials file copied to /root/.smbcredentials"
  when: smbcreds_copied.changed

- name: Display SMB credentials not found message
  debug:
    msg: ".smbcredentials file not found on controller - skipping copy"
  when: not smbcreds_controller.stat.exists

- name: Check if .smbcredentials exists on controller
  stat:
    path: "{{ lookup('env', 'HOME') }}/.paperless_smbcreds"
  register: smbcreds_controller
  delegate_to: localhost
  become: false
  changed_when: false

- name: Copy .smbcredentials file to target root home
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/.paperless_smbcreds"
    dest: /root/.paperless_smbcreds
    owner: root
    group: root
    mode: "0600"
  become: true
  when: smbcreds_controller.stat.exists
  register: smbcreds_copied

- name: Display SMB credentials copy status
  debug:
    msg: ".paperless_smbcreds file copied to /root/.paperless_smbcreds"
  when: smbcreds_copied.changed

- name: Display SMB credentials not found message
  debug:
    msg: ".paperless_smbcreds file not found on controller - skipping copy"
  when: not smbcreds_controller.stat.exists
