---
# Podman compose repository setup (handles cloning only)
compose_repo_url: git@github.com:Phoenixcom1/docker_compose.git
compose_repo_path: /opt/docker_compose

# podman_service_dir is defined in group_vars/all.yml
# podman_user is defined in group_vars/all.yml (as podman_username)
podman_user: "{{ podman_username }}"
# SSH key path is inherited from podman-user role (podman_ssh_key_path)
