---
# Wyoming-Whisper service deployment using Podman Quadlets

# Discover podman user's UID and GID
- name: Get podman user info
  getent:
    database: passwd
    key: "{{ podman_user }}"
  register: podman_user_info
  changed_when: false

- name: Extract podman user UID and GID
  set_fact:
    podman_user_uid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][1] }}"
    podman_user_gid: "{{ podman_user_info.ansible_facts.getent_passwd[podman_user][2] }}"
  when: podman_user in podman_user_info.ansible_facts.getent_passwd

# Create data directory for Whisper
- name: Check if whisper data directory exists
  stat:
    path: "{{ whisper_data_dir }}"
  register: whisper_data_stat

- name: Create whisper data directory if missing
  file:
    path: "{{ whisper_data_dir }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true
  when: not whisper_data_stat.stat.exists

# Ensure correct ownership (fix permission issues)
- name: Fix whisper data directory ownership
  file:
    path: "{{ whisper_data_dir }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
    recurse: yes
  become: true

# Create Quadlet directory (Podman systemd units)
- name: Create Quadlet directory for podman user
  file:
    path: "/home/{{ podman_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"
  become: true

# Deploy Quadlet file
- name: Deploy whisper Quadlet file
  template:
    src: whisper.container.j2
    dest: "/home/{{ podman_user }}/.config/containers/systemd/whisper.container"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0644"
  become: true
  register: quadlet_deployed

# Enable lingering for podman user (allows user services to run without login)
- name: Enable lingering for podman user
  command: loginctl enable-linger {{ podman_user }}
  become: true
  changed_when: false

# Reload systemd daemon to pick up Quadlet changes
- name: Reload systemd user daemon (Quadlet generation)
  systemd:
    daemon_reload: yes
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"

# Restart service if Quadlet changed, otherwise ensure it's enabled and started
- name: Restart whisper service (Quadlet changed)
  systemd:
    name: whisper
    state: restarted
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  when: quadlet_deployed.changed

- name: Ensure whisper service is enabled and started
  systemd:
    name: whisper
    enabled: yes
    state: started
    scope: user
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid }}"
  when: not quadlet_deployed.changed

- name: Display whisper deployment result
  debug:
    msg: |
      Whisper deployed successfully via Podman Quadlet!
      - Quadlet: ~/.config/containers/systemd/whisper.container
      - Service: whisper.service (auto-generated by systemd)
      - Port: {{ whisper_port }} (direct TCP access)
      - Model: {{ whisper_model }}
      - Language: {{ whisper_language }}
      - Auto-update: Enabled (via AutoUpdate=registry in Quadlet)
      - Manage: systemctl --user status whisper
      - View logs: journalctl --user -u whisper -f
      - Note: Use IP address in Home Assistant (Wyoming uses raw TCP, not HTTP)

