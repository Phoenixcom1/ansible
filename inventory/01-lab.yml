#We have to set both, static_ip and ansible_host as ansible_host will be overriden first time execution

all:
  hosts:
    docker-vm:
      static_ip: 192.168.1.118
      static_gateway: "{{ gateway_lab}}"
      ansible_host: "{{ static_ip }}"
      local_username: "docker_vm"
      #vlan_id: 107
      #vlan_ip_address: "" # Leave empty; IP will be on the bridge instead
      #bridge_name: "br-vlan107" # Host bridge on VLAN 107
      #bridge_ip: "192.168.107.2/24" # IP for the host bridge
      xrdp: true
    podman-vm:
      static_ip: 192.168.1.68
      static_gateway: "{{ gateway_lab}}"
      ansible_host: "{{ static_ip }}"
      local_username: "podman_vm"
      #vlan_id: 107
      #vlan_ip_address: "" # Leave empty; IP will be on the bridge instead
      #bridge_name: "br-vlan107" # Host bridge on VLAN 107
      #bridge_ip: "192.168.107.2/24" # IP for the host bridge
      xrdp: true
    podman-vm-pve0:
      static_ip: 192.168.1.224
      static_gateway: "{{ gateway_lab}}"
      ansible_host: "{{ static_ip }}"
      local_username: "podman_vm"
      ssl_cert: "/etc/ssl/wildcard/kerberos.bitsnbyt.es/fullchain.pem"
      ssl_key: "/etc/ssl/wildcard/kerberos.bitsnbyt.es/key.pem"
      paperless_enable_media_mount: true
      paperless_media_mount_source: "//truenas.{{ customer_domain }}/paperless-media"
      paperless_media_smb_username: "{{ truenas_paperless_smb_username }}"
      paperless_media_smb_password: "{{ truenas_paperless_smb_password }}"
      # Store the API token in the ignored companion inventory or provide
      # TRUENAS_API_TOKEN.
      truenas_nfs_server: "truenas.{{ customer_domain }}"
      truenas_nfs_mounts:
        - dataset: "tank/apps/nextcloud-data"
          export_path: "/mnt/tank/apps/nextcloud-data"
          path: "/srv/containers/nextcloud-data"
          encrypted: true
      truenas_datasets:
        - name: photos
          dataset: "tank/photos"
          export_path: "/mnt/tank/photos"
          encrypted: true
          group: photos-access
          users:
            - username: "{{ truenas_immich_smb_username }}"
              password: "{{ truenas_immich_smb_password }}"
              full_name: "Immich account"
          snapshot_retention:
            daily: 14
            weekly: 8
            monthly: 12
          replication: true
        - name: paperless-media
          dataset: "tank/apps/paperless-media"
          export_path: "/mnt/tank/apps/paperless-media"
          share_name: "paperless-media"
          encrypted: true
          group: paperless-media
          permission_user: "{{ truenas_paperless_smb_username }}"
          users:
            - username: "{{ truenas_paperless_smb_username }}"
              password: "{{ truenas_paperless_smb_password }}"
              full_name: "Paperless media account"
          snapshot_retention:
            daily: 14
            weekly: 8
            monthly: 12
        - name: proxmox-vm-backups
          dataset: "tank/backups/proxmox-vm-backups"
          export_path: "/mnt/tank/backups/proxmox-vm-backups"
          share_name: "proxmox-vm-backups"
          encrypted: true
          group: proxmox-vm-backups
          users:
            - username: "proxmox-vm-backup"
              password: "{{ truenas_proxmox_vm_backup_account_password }}"
              full_name: "Proxmox VM backup account"
          # Restrict SMB access to the Proxmox hosts at the TrueNAS or network
          # firewall: 192.168.1.20 and 192.168.1.11.
      truenas_system_config_enabled: true
      # Temporary Cloud Sync SFTP test using the existing restic account.
      # Replace the account and encryption values before production use.
      truenas_cloud_sync_enabled: true
      truenas_cloud_sync_destinations:
        - name: restic-sftp-test
          credential:
            name: restic-sftp-test
            provider:
              type: SFTP
              host: "restic.kerberos.bitsnbyt.es"
              port: 22
              user: "restic"
              pass: "{{ truenas_restic_smb_password }}"
              private_key: null
      truenas_cloud_sync_jobs:
        - name: photos-test
          datasets:
            - "/mnt/tank/photos"
          destinations:
            - restic-sftp-test
          folder: "Truenas_Cloud_Sync/podman-vm-pve0"
          encryption_password: "{{ truenas_dataset_encryption_passphrase }}"
          # Temporary test configuration; use a separate vaulted salt in production.
          encryption_salt: "{{ truenas_dataset_encryption_passphrase }}"
      restic_backup_enabled_services:
        - vaultwarden
        - homepage
        - immich
        - jellyfin
      restic_service_overrides:
        immich:
          destinations:
            - rest-offsite
          paths:
            - "{{ immich_upload_dir | default('/srv/containers/immich-data') }}"
            - "{{ podman_service_dir }}/immich/postgres"
            - "{{ podman_service_dir }}/immich/immich.env"
      restic_additional_destinations:
        - name: rest-offsite
          repository: "rest:https://restic.kerberos.bitsnbyt.es/restic/podman-vm-pve0"
          password_file: "/root/.restic-password-rest-offsite"
          rest:
            username: "restic"
            password: "{{ restic_rest_offsite_password }}"
      truenas_replication_enabled: true
      truenas_replication_destination_api_url: "https://192.168.1.228"
      truenas_replication_destination_api_validate_certs: false
      truenas_replication_destination_dataset: "tank/Truenas_Backup_Enno"
      # The destination account identifies this source host to the remote NAS.
      truenas_replication_remote_username: "truenas-repl-Enno"
      # Temporary rsync destination test for the Synology client. The role is
      # intentionally not enabled in fedora_base.yml by default.
      truenas_rsync_destination_dataset_parents:
        - "tank/backups"
      truenas_rsync_destinations:
        - name: synology-test
          dataset: "tank/backups/synology-test"
          export_path: "/mnt/tank/backups/synology-test"
          username: "synology-test"
          password: "{{ truenas_restic_smb_password }}"
          allowed_hosts:
            - "192.168.1.50"
      #vlan_id: 107
      #vlan_ip_address: "" # Leave empty; IP will be on the bridge instead
      #bridge_name: "br-vlan107" # Host bridge on VLAN 107
      #bridge_ip: "192.168.107.2/24" # IP for the host bridge
      xrdp: true
  vars:
    ansible_user: ansible
    gateway_lab: 192.168.1.1
    ansible_private_key_file: ~/.ssh/id_ed25519_priv
