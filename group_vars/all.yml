---
# Global variables available to all hosts and roles

# Podman user configuration (shared across all container deployment roles)
podman_username: podman
podman_service_dir: /opt/podman

# Per-client domain. Override this for each client environment.
customer_domain: "kerberos.bitsnbyt.es"

# Verify the TrueNAS API certificate for all storage provisioners.
truenas_api_validate_certs: true

# Shared encryption defaults for TrueNAS datasets created by any storage
# provisioner role. The passphrase is only needed when an encrypted dataset is
# first created; keep the real value in vaulted inventory or provide it through
# the environment.
truenas_dataset_encryption_passphrase: "{{ lookup('env', 'TRUENAS_DATASET_ENCRYPTION_PASSPHRASE') | default('', true) }}"
truenas_dataset_encryption_algorithm: "AES-256-GCM"
truenas_dataset_encryption_pbkdf2iters: 350000

# Shared TrueNAS SMB account used by Immich-owned media datasets. Keep the
# password in vaulted inventory; the username is referenced by storage and
# container roles.
truenas_immich_smb_username: "immich-media"
truenas_immich_smb_password: ""

# Dedicated SMB account for Proxmox VM backup storage. Set this through the
# environment or an ignored vaulted inventory override.
truenas_proxmox_vm_backup_account_password: "{{ lookup('env', 'TRUENAS_PROXMOX_VM_BACKUP_ACCOUNT_PASSWORD') | default('', true) }}"

# SSL certificate paths (used by nginx reverse proxy for all services)
# Wildcard certificate locations deployed by your firewall
ssl_cert: "/etc/ssl/wildcard/kerberos.fassbender.contact/fullchain.pem"
ssl_key: "/etc/ssl/wildcard/kerberos.fassbender.contact/key.pem"
nginx_conf_dir: "/etc/nginx/conf.d"

# Global DNS configuration for hosts and containers
# Primary/secondary/fallback DNS servers can be overridden per environment.
dns_primary_nameserver: "192.168.1.249"
dns_secondary_nameserver: "1.1.1.1"
dns_fallback_nameservers:
  - "8.8.8.8"
  - "8.8.4.4"
dns_search_domains:
  - "kerberos.bitsnbyt.es"
dns_nameservers_effective: "{{ [dns_primary_nameserver, dns_secondary_nameserver] + dns_fallback_nameservers }}"
